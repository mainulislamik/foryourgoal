services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foryourgoal_web
    restart: unless-stopped
    ports:
      - "172.17.0.1:3012:3000"
      - "127.0.0.1:3012:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://foryourgoal.com
      - COMPANY_EMAIL=info@foryourgoal.com
      - SMTP_HOST=172.17.0.1
      - SMTP_PORT=25
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
